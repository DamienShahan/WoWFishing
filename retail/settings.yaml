# Paths are relative to this file. Device indices can change after reconnecting.
audio:
  device_index: null # null selects the default WASAPI output loopback
  chunk_seconds: 0.1
  min_rms: 0.0001 # absolute amplitude floor, for WAV/PCM scaled to [-1, 1]

detection:
  mode: spectral # waveform or spectral; compare using evaluate.py
  cooldown_seconds: 1.5 # suppress repeated live listen-only reports
  ambiguity_margin: 0.05 # difference in normalized threshold margins
  spectral_bands: 48
  spectral_window_ms: 25
  spectral_hop_ms: 10
  pcen_time_constant: 0.4

events:
  target:
    enabled: true
    templates: sounds/target/*.wav
    waveform_threshold: 0.65 # PROVISIONAL; calibrate with your recordings
    spectral_threshold: 0.70
  out_of_range:
    enabled: false
    templates: sounds/out_of_range/*.wav
    waveform_threshold: 0.70
    spectral_threshold: 0.85

automation:
  window_title_regex: "^World of Warcraft$"
  action_key: k
  listen_seconds: 23
  target_guard_seconds: 0.8 # ignore target matches starting before this after cast
  wait_after_target: [1.5, 2.5]
  wait_after_out_of_range: [1.0, 1.5]
  wait_after_timeout: [1.0, 2.0]
  use_lure: false
  lure_key: f5
  lure_interval_seconds: 610
  lure_wait: [5.1, 5.5]
